<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微信自动助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 左侧栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">🐋</span>
        <span class="brand-name">微信自动助手</span>
        <span class="brand-tag">Beta</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="status">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
          <span>运行状态</span>
        </button>
        <button class="nav-item" data-page="chats">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>
          <span>群聊设置</span>
        </button>
        <button class="nav-item" data-page="model">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>
          <span>模型设置</span>
        </button>
        <button class="nav-item" data-page="persona">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.2 4.5 5 .7-3.6 3.5.9 5L12 14.4 7.5 16.7l.9-5L4.8 8.2l5-.7z"/></svg>
          <span>人设</span>
        </button>
        <button class="nav-item" data-page="logs">
          <svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
          <span>运行日志</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <span class="status-dot" id="wx-dot"></span>
        <div class="sidebar-bottom-text">
          <div class="sb-title" id="wx-title">未连接微信</div>
          <div class="sb-sub" id="wx-sub">—</div>
        </div>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="main">
      <!-- 运行状态 -->
      <section class="page active" id="page-status">
        <h1 class="page-title">运行状态</h1>
        <div class="cards">
          <div class="card status-card">
            <div class="status-row">
              <div>
                <div class="card-label">微信连接</div>
                <div class="card-value" id="s-wx">检测中…</div>
              </div>
              <button class="btn ghost" id="btn-connect">连接微信</button>
            </div>
            <div class="status-row">
              <div>
                <div class="card-label">消息监听</div>
                <div class="card-value" id="s-listen">—</div>
              </div>
            </div>
          </div>

          <div class="card status-card">
            <div class="card-label">自动回复</div>
            <div class="big-toggle">
              <div class="card-value" id="s-bot">已停止</div>
              <button class="btn primary lg" id="btn-toggle">开启</button>
            </div>
            <div class="mini-stats">
              <div><span class="mini-num" id="s-count">0</span><span class="mini-label">今日回复</span></div>
              <div><span class="mini-num" id="s-last">—</span><span class="mini-label">最后触发</span></div>
            </div>
          </div>
        </div>
        <p class="hint">提示：自动回复在本程序运行期间有效。微信 PC 客户端需已登录且主窗口可见。</p>
      </section>

      <!-- 群聊设置 -->
      <section class="page" id="page-chats">
        <h1 class="page-title">群聊设置</h1>
        <div class="card">
          <div class="card-label">触发条件</div>
          <label class="switch-row"><span>群里有人 @我 时回复</span>
            <input type="checkbox" class="switch" data-key="trigger_at"/></label>
          <label class="switch-row"><span>群里有人引用/回复我的消息时回复</span>
            <input type="checkbox" class="switch" data-key="trigger_reply"/></label>
          <label class="switch-row"><span>私聊消息也回复</span>
            <input type="checkbox" class="switch" data-key="reply_private"/></label>
          <div class="field">
            <label>会话延续（秒）：刚回复过的人在此时间内继续发言也接着回，0 = 关闭</label>
            <input type="number" min="0" max="3600" step="10" data-key="continuation_seconds"/>
          </div>
        </div>

        <div class="card">
          <div class="card-label">作用范围</div>
          <div class="segmented">
            <button type="button" class="seg active" data-scope="all">所有群</button>
            <button type="button" class="seg" data-scope="custom">仅指定群</button>
          </div>
          <div class="field" id="groups-field" style="display:none">
            <label>群名称列表（每行一个，需与微信显示的群名一致）</label>
            <textarea rows="5" id="groups-input" placeholder="玩什么游戏？&#10;另一个群"></textarea>
          </div>
        </div>
        <div class="actions"><button class="btn primary" id="save-chats">保存设置</button></div>
      </section>

      <!-- 模型设置 -->
      <section class="page" id="page-model">
        <h1 class="page-title">模型设置</h1>
        <div class="card form">
          <div class="field">
            <label>API 地址（OpenAI 兼容）</label>
            <input type="text" data-key="api_base" placeholder="https://api.deepseek.com"/>
          </div>
          <div class="field">
            <label>API Key</label>
            <input type="password" data-key="api_key" placeholder="sk-..."/>
          </div>
          <div class="field">
            <label>模型名称</label>
            <input type="text" data-key="model" placeholder="deepseek-chat"/>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Temperature <span class="val" id="temp-val"></span></label>
              <input type="range" min="0" max="2" step="0.1" data-key="temperature"/>
            </div>
            <div class="field">
              <label>最大回复长度（tokens）</label>
              <input type="number" min="1" max="4096" data-key="max_tokens"/>
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>上下文条数</label>
              <input type="number" min="1" max="50" data-key="context_messages"/>
            </div>
            <div class="field">
              <label>请求超时（秒）</label>
              <input type="number" min="1" max="300" data-key="timeout_seconds"/>
            </div>
          </div>
          <div class="field">
            <label>同一人冷却（秒）</label>
            <input type="number" min="0" max="60" step="0.5" data-key="cooldown_seconds"/>
          </div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btn-test">测试连接</button>
          <button class="btn primary" id="save-model">保存设置</button>
        </div>
      </section>

      <!-- 人设 -->
      <section class="page" id="page-persona">
        <h1 class="page-title">人设</h1>
        <div class="card">
          <div class="card-label">系统提示词（System Prompt）</div>
          <textarea id="persona-input" class="persona-editor" rows="20" spellcheck="false"></textarea>
          <p class="hint">编辑内容会作为角色人设追加到 system 提示词；留空（默认）则只保留内置的「只回应待回复消息」行为约束。</p>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btn-reset-persona">清空人设</button>
          <button class="btn primary" id="save-persona">保存人设</button>
        </div>
      </section>

      <!-- 运行日志 -->
      <section class="page" id="page-logs">
        <h1 class="page-title">运行日志</h1>
        <div class="card log-card">
          <div class="log-toolbar">
            <label class="mini-check"><input type="checkbox" id="log-follow" checked/> 自动滚动</label>
            <button class="btn ghost xs" id="btn-clear-log">清空显示</button>
          </div>
          <div class="log-box" id="log-box"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
